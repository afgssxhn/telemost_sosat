<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcription</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Transcription</h1>
      <div class="status" id="status">Not recording</div>
    </div>

    <div class="tab-info" id="tab-info">
      <span class="tab-label">Tab:</span>
      <span class="tab-name" id="tab-name">Click the extension icon on the desired tab</span>
    </div>

    <div class="controls">
      <button id="btn-toggle" class="btn btn-primary" disabled>&#9654; Start</button>
      <button id="btn-copy-all" class="btn btn-secondary" disabled>Copy all</button>
      <button id="btn-copy-last" class="btn btn-secondary" disabled>Copy last</button>
      <button id="btn-clear" class="btn btn-danger" disabled>Clear</button>
    </div>

    <div class="transcript-area" id="transcript-area">
      <div class="placeholder" id="placeholder">Click the extension icon on a tab with audio, then press "Start"</div>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
