<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telemost Transcriber — Settings</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Telemost Transcriber</h1>
    <p class="subtitle">Settings</p>

    <div class="field">
      <label for="api-key">Deepgram API Key</label>
      <input type="password" id="api-key" placeholder="Enter your Deepgram API key" autocomplete="off">
      <p class="hint">Get a key at <a href="https://console.deepgram.com/" target="_blank">console.deepgram.com</a></p>
    </div>

    <div class="field">
      <label for="claude-model">Claude Model</label>
      <select id="claude-model">
        <option value="claude-sonnet-4-20250514">Claude Sonnet 4</option>
        <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
      </select>
      <p class="hint">Model used by the AI button in the side panel</p>
    </div>

    <button id="btn-save" class="btn">Save</button>
    <div id="message" class="message"></div>
  </div>

  <script src="utils.js"></script>
  <script src="options.js"></script>
</body>
</html>
